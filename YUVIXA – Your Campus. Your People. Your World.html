<body>
<div id="banner" role="status">Demo mode: fictional data. Verification and notifications are simulated, not real.</div>
<header class="top"><span class="logo">YUVIXA</span><span style="display:flex;gap:.5rem;align-items:center"><select class="who" aria-label="Demo: view as user"></select><button data-act="theme" aria-label="Toggle theme" id="t1"></button></span></header>

<script>
const Y = (() => {
// Mirrors supabase/migrations/0001_foundation.sql. Client use is for UX only; the database is authoritative.
const GRADUATE_WINDOW_YEARS = 3;
const CAMPUS_DEADLINE_DAYS = 14;

                                                             
                                                                                 

const pad = (n        ) => String(n).padStart(2, '0');
const utcDate = (d      )         => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;

// Same clamping as Postgres: Feb 29 minus N years lands on Feb 28 of a non-leap year.
function minusYears(iso        , years        )         {
  const [y, m, d] = iso.split('-').map(Number);
  const ty = y - years;
  const maxDay = new Date(Date.UTC(ty, m, 0)).getUTCDate();
  return `${ty}-${pad(m)}-${pad(Math.min(d, maxDay))}`;
}

/** Registration-time only. Window is inclusive, evaluated on the UTC date. Never an expiry rule. */
function isGraduateEligibleAtRegistration(graduationDate        , now      )          {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(graduationDate)) return false;
  const today = utcDate(now);
  return graduationDate <= today && graduationDate >= minusYears(today, GRADUATE_WINDOW_YEARS);
}

const campusDeadline = (registeredAt      )       =>
  new Date(registeredAt.getTime() + CAMPUS_DEADLINE_DAYS * 86_400_000);

/** Verified accounts are never restricted for graduating or leaving campus. */
function mustRestrictForCampusDeadline(s                                                    , now      )          {
  return s.campusState === 'pending' && s.campusDeadline.getTime() < now.getTime();
}

/** Birthday matching on the celebrant's LOCAL date. Feb 29 is celebrated on Feb 28 in non-leap years. */
function isBirthdayOn(birthDate        , localDate        )          {
  const [, bm, bd] = birthDate.split('-').map(Number);
  const [ly, lm, ld] = localDate.split('-').map(Number);
  if (bm === lm && bd === ld) return true;
  const leap = (ly % 4 === 0 && ly % 100 !== 0) || ly % 400 === 0;
  return bm === 2 && bd === 29 && !leap && lm === 2 && ld === 28;
}

const TRANSITIONS                                               = {
  pending: ['accepted', 'rejected', 'cancelled'], accepted: [], rejected: [], cancelled: [],
};
const canTransition = (from                  , to                  ) => TRANSITIONS[from].includes(to);

const birthdayDedupeKey = (celebrant        , year        , recipient        ) => `bday:${celebrant}:${year}:${recipient}`;

// Deterministic, entirely fictional dataset. Same code => byte-identical output. "Now" is fixed for reproducibility.
                                                                                                               

const SEED_NOW = '2026-10-26T06:00:00.000Z';
const H = 3_600_000, D = 24 * H;
const ago = (ms        ) => new Date(Date.parse(SEED_NOW) - ms).toISOString();
const pad2 = (n        ) => String(n).padStart(2, '0');
const id = (p        , i        ) => `${p}_${pad2(i + 1)}`;
function rng(seed        ) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const F = ['Aarav', 'Diya', 'Kabir', 'Ananya', 'Rohan', 'Meera', 'Ishaan', 'Saanvi', 'Vihaan', 'Tara'];
const L = ['Sharma', 'Iyer', 'Nair', 'Khanna', 'Reddy', 'Bose', 'Mehta', 'Gill', 'Joshi', 'Rao'];
const BODIES = ['Anyone up for chai at the canteen?', 'Library group study tonight, bring notes.', 'Hackathon team needs one designer.',
  'Lost my earphones near the gym, please help!', 'Sunset at the football ground is unreal today.', 'Mess menu rating: 7/10, paneer wins.'];
const REG_DAYS = [400, 3, 20, 10, 800];                          // scenario per user index % 5
const CASE_BY = ['verified', 'pending', 'pending', 'review_needed', 'verified']         ;

function buildSeed()          {
  const users                = Array.from({ length: 20 }, (_, i) => {
    const r = rng(1000 + i), regDays = REG_DAYS[i % 5], grad = i % 5 === 4;
    const month = i < 5 ? 10 : 1 + Math.floor(r() * 12), day = i < 5 ? 26 : 1 + Math.floor(r() * 28);  // users 0-4: birthday on seed day
    return { id: id('usr', i), username: `${F[i % 10]}${L[(i * 3 + 1 + Math.floor(i / 10)) % 10]}${i}`.toLowerCase(),
      displayName: `${F[i % 10]} ${L[(i * 3 + 1 + Math.floor(i / 10)) % 10]}`, collegeId: 'col_01', course: ['B.Tech CSE', 'BBA', 'B.Des', 'B.Sc Physics'][i % 4],
      enrollmentKind: grad ? 'graduate' : 'current', graduationDate: grad ? ago(regDays * D + 60 * D).slice(0, 10) : null,
      birthDate: `2004-${pad2(month)}-${pad2(day)}`, tz: 'Asia/Kolkata', visibility: i % 7 === 6 ? 'connections' : 'college',
      avatarSeed: `yuvixa-${i}`, registeredAt: ago(regDays * D), accountStatus: 'active' };
  });
  const prefOverride                                     = { 0: [true, true], 1: [true, true], 2: [true, false], 3: [false, true], 4: [true, true] };
  const birthdayPrefs = users.map((u, i) => { const r = rng(2000 + i); const [visible, reminders] = prefOverride[i] ?? [r() < .5, r() < .5]; return { userId: u.id, visible, reminders }; });

  const posts = Array.from({ length: 30 }, (_, i) => { const r = rng(3000 + i);
    return { id: id('pst', i), authorId: users[i % 20].id, body: BODIES[Math.floor(r() * BODIES.length)], visibility: (i % 10 === 9 ? 'private' : 'connections')                             ,
      createdAt: ago((i + 1) * 5 * H), deletedAt: null }; });
  const comments = Array.from({ length: 50 }, (_, i) => ({ id: id('cmt', i), postId: posts[i % 30].id, authorId: users[(i * 7 + 3) % 20].id, body: ['Count me in!', 'Nice one 😄', 'Same here.', 'Where exactly?', 'Love this.'][i % 5], createdAt: ago(i * 2 * H) }));
  const likes = Array.from({ length: 25 }, (_, i) => ({ postId: posts[i].id, userId: users[(i * 3 + 1) % 20].id, createdAt: ago(i * H) }));
  const statuses = ['accepted', 'accepted', 'pending', 'rejected', 'accepted']         ;
  const requests                      = Array.from({ length: 15 }, (_, i) => ({ id: id('req', i), requesterId: users[i].id, addresseeId: users[i + 1].id,
    status: statuses[i % 5], createdAt: ago((20 - i) * D), respondedAt: statuses[i % 5] === 'pending' ? null : ago((19 - i) * D) }));
  const clubs = ['Coding Club', 'Dance Society', 'Photography Club', 'Debate Union', 'Robotics Lab'].map((name, i) => ({ id: id('clb', i), name, about: `${name}: open to all branches.`, organizerId: users[i].id }));
  const events = Array.from({ length: 10 }, (_, i) => ({ id: id('evt', i), title: ['Hack Night', 'Fresher’s Fest', 'Photo Walk', 'Open Mic', 'Robo Race'][i % 5] + ` #${i + 1}`,
    clubId: clubs[i % 5].id, organizerId: users[i % 5].id, startsAt: new Date(Date.parse(SEED_NOW) + (i + 1) * D).toISOString(), location: ['Main Auditorium', 'Block C Lawn', 'Library Steps'][i % 3] }));
  const confessions = Array.from({ length: 10 }, (_, i) => ({ id: id('cnf', i), body: ['I still don’t know the way to Block D.', 'The canteen samosa deserves an award.', 'I talk to the library cat daily.'][i % 3],
    status: (i === 7 ? 'hidden' : i === 8 ? 'pending_review' : 'visible')                                           , createdAt: ago(i * 7 * H) }));
  const matches = Array.from({ length: 5 }, (_, i) => ({ id: id('mtc', i), aId: users[10 + i].id, bId: users[15 + i].id, status: (i % 2 ? 'one_sided' : 'mutual')                           }));
  const lostFound = Array.from({ length: 10 }, (_, i) => ({ id: id('lnf', i), kind: (i % 2 ? 'found' : 'lost')                    , title: ['Blue water bottle', 'Black umbrella', 'Wired earphones', 'Calculator', 'Notebook'][i % 5],
    location: ['Library', 'Gym', 'Block A', 'Canteen', 'Auditorium'][i % 5], status: (i === 9 ? 'resolved' : 'open')                       , reporterId: users[i].id, createdAt: ago(i * 9 * H) }));
  const kinds                     = ['connection_request', 'connection_accepted', 'like', 'comment', 'event_reminder', 'verification', 'announcement'];
  const notifications = Array.from({ length: 15 }, (_, i) => ({ id: id('ntf', i), userId: users[i % 20].id, kind: kinds[i % 7], link: i % 7 === 4 ? `/events/${events[0].id}` : '/notifications',
    dedupeKey: `seed:${i}`, readAt: i % 3 === 0 ? ago(i * H) : null, createdAt: ago((i + 1) * 3 * H) }));
  const verification                     = users.map((u, i) => ({ userId: u.id, emailStatus: 'approved', idStatus: CASE_BY[i % 5] === 'verified' ? 'approved' : i % 5 === 3 ? 'manual_review' : 'pending',
    livenessStatus: i % 2 ? 'not_started' : 'approved', campusState: CASE_BY[i % 5], campusDeadline: new Date(Date.parse(u.registeredAt) + 14 * D).toISOString(), simulated: true }));
  return { users, birthdayPrefs, posts, comments, likes, requests, blocks: [], events, clubs, confessions, matches, lostFound, notifications, verification };
}

// Mock repositories + domain services. UI must depend on the *Repository interfaces only; Supabase adapters implement the same ones.
// Nothing here is real security: mock auth/verification/notifications simulate behaviour for development.
                                                                                                                                                           


class DomainError extends Error { code        ; constructor(code        ) { super(code); this.code = code; } }   // same codes as the future DB errors
                                      
const fixedClock = (iso        )                                     => { let t = Date.parse(iso); return { now: () => new Date(t), set: v => { t = Date.parse(v); } }; };

class MockStore {
  data         ; deliveryLog                = []; saved                                       = []; seq = 1000;
  constructor(data          = buildSeed()) { this.data = structuredClone(data); }
  reset() { this.data = structuredClone(buildSeed()); this.deliveryLog = []; this.saved = []; }
  blocked(a        , b        ) { return this.data.blocks.some(x => (x.blockerId === a && x.blockedId === b) || (x.blockerId === b && x.blockedId === a)); }
  connected(a        , b        ) { return !this.blocked(a, b) && this.data.requests.some(r => r.status === 'accepted' && ((r.requesterId === a && r.addresseeId === b) || (r.requesterId === b && r.addresseeId === a))); }
  /** Idempotent: a repeated dedupeKey for the same user creates nothing. Delivery is logged as simulated, never pushed. */
  notify(userId        , kind                  , link        , dedupeKey        , at      )          {
    if (this.data.notifications.some(n => n.userId === userId && n.dedupeKey === dedupeKey)) return false;
    const n                  = { id: `ntf_${this.seq++}`, userId, kind, link, dedupeKey, readAt: null, createdAt: at.toISOString() };
    this.data.notifications.push(n); this.deliveryLog.push({ notificationId: n.id, channel: 'in_app', status: 'simulated', at: at.toISOString() }); return true;
  }
}

                                       
                                                             
                                                                                                         
                                                                                                                   
 
class MockConnectionRepository                                 {
  s           ; clock       ; constructor(s           , clock       ) { this.s = s; this.clock = clock; }
  async send(from        , to        ) {
    const u = this.s.data.users;
    if (from === to) throw new DomainError('self_connection');
    if (!u.some(x => x.id === from) || !u.some(x => x.id === to)) throw new DomainError('user_not_found');
    if (this.s.blocked(from, to)) throw new DomainError('cannot_connect');
    if (this.s.data.requests.some(r => (r.status === 'pending' || r.status === 'accepted') && ((r.requesterId === from && r.addresseeId === to) || (r.requesterId === to && r.addresseeId === from)))) throw new DomainError('duplicate_request');
    const r                    = { id: `req_${this.s.seq++}`, requesterId: from, addresseeId: to, status: 'pending', createdAt: this.clock.now().toISOString(), respondedAt: null };
    this.s.data.requests.push(r); this.s.notify(to, 'connection_request', `/profile/${from}`, `creq:${r.id}`, this.clock.now()); return r;
  }
  async respond(id        , actor        , action                                ) {
    const r = this.s.data.requests.find(x => x.id === id);
    if (!r || r.status !== 'pending') throw new DomainError('invalid_transition');
    if (action === 'cancel' ? r.requesterId !== actor : r.addresseeId !== actor) throw new DomainError('forbidden');
    r.status = action === 'accept' ? 'accepted' : action === 'reject' ? 'rejected' : 'cancelled'; r.respondedAt = this.clock.now().toISOString();
    if (action === 'accept') this.s.notify(r.requesterId, 'connection_accepted', `/profile/${actor}`, `cacc:${r.id}`, this.clock.now());
    return r;
  }
  async areConnected(a        , b        ) { return this.s.connected(a, b); }
  async blockUser(blocker        , blocked        ) { if (!this.s.data.blocks.some(x => x.blockerId === blocker && x.blockedId === blocked)) this.s.data.blocks.push({ blockerId: blocker, blockedId: blocked }); }
}

                                         
                                                                                                                                  
                                                                                                                                                
 
class MockNotificationRepository                                   {
  s           ; clock       ; constructor(s           , clock       ) { this.s = s; this.clock = clock; }
  async list(userId        , o                                      = {}) {
    const limit = o.limit ?? 20;
    const all = this.s.data.notifications.filter(n => n.userId === userId && (!o.before || n.createdAt < o.before)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    const items = all.slice(0, limit); return { items, nextCursor: all.length > limit ? items[items.length - 1].createdAt : null };
  }
  async unreadCount(userId        ) { return this.s.data.notifications.filter(n => n.userId === userId && !n.readAt).length; }
  async markRead(userId        , id        ) { const n = this.s.data.notifications.find(x => x.id === id && x.userId === userId); if (!n) throw new DomainError('not_found'); n.readAt ??= this.clock.now().toISOString(); }
  async markAllRead(userId        ) { for (const n of this.s.data.notifications) if (n.userId === userId) n.readAt ??= this.clock.now().toISOString(); }
}

/** Production equivalent: scheduled server job (hourly), never the app. Local date is evaluated in the celebrant's own timezone. */
class BirthdayNotificationService {
  s           ; clock       ; constructor(s           , clock       ) { this.s = s; this.clock = clock; }
  /** Simulated greeting: allowed only for accepted, unblocked connections whose birthday is visible and today (celebrant's timezone). */

}
function nav() {

  const items = [['home', 'home', 'Home', '#/home'], ['explore', 'search', 'Search', '#/explore'], ['notifications', 'heart', 'Notifications', '#/notifications']];

  const mk = full => items.map(i => link(...i, full)).join('') + `<button class="ni" data-act="create" aria-label="Create">${I('plus', false, sz)}${full ? '<span>Create</span>' : ''}</button>` + link('verify', 'shield', 'Verification', '#/verify', full) + link('profile', 'user', 'Profile', '#/profile/' + me, full);
  $('#rail').innerHTML = `<span class="logo">YUVIXA</span>${mk(true)}<span style="flex:1"></span><button class="ni" data-act="theme">${I('moon', false, sz)}<span>Switch appearance</span></button>`;
  $('#bottom').innerHTML = mk(false); $('#t1').innerHTML = I('moon', false, 20);
}
async function render() {
  const [v, arg, tab] = (location.hash.slice(2) || 'home').split('/'); nav.unread = await notes.unreadCount(me); nav();
  const views = { home, post: home, explore, notifications: alerts, verify, profile: () => profile(arg || me, tab) };
  const col = $('#view'); col.className = v === 'profile' ? 'wide' : 'col';
  const focused = document.activeElement?.matches?.('[data-search]');
  if (!(v === 'explore' && focused)) col.innerHTML = await (views[v] || (async () => '<div class="box">Page not found.</div>'))();
  const sug = S.data.users.filter(u => u.id !== me && !S.connected(me, u.id) && !S.blocked(me, u.id)).slice(0, 5), mu = U(me);
  $('#right').innerHTML = `<div class="row"><div>${av(mu, 52)}<span><b>${esc(mu.username)}</b><br><small>${esc(mu.displayName)}</small></span></div><select class="who" aria-label="Demo: view as user"></select></div>
  <div class="row"><b class="mut">Suggested for you</b><a href="#/explore" class="mut">See all</a></div>${sug.map(u => `<div class="row"><a href="#/profile/${u.id}"><div>${av(u, 36)}<span><b>${esc(u.username)}</b><br><small>${esc(u.course)}</small></span></div></a>${relBtn(u.id)}</div>`).join('')}<small>© YUVIXA demo · Your Campus. Your People. Your World.</small>`;
  document.querySelectorAll('.who').forEach(s => { s.innerHTML = S.data.users.map(u => `<option value="${u.id}">${esc(u.displayName)}</option>`).join(''); s.value = me; });
  if (v === 'post' && modal !== arg) showPost(arg); else if (modal) showPost(modal);
}
const ERR = { duplicate_request: 'Request already exists.', cannot_connect: 'You can’t connect with this user.', not_found: 'Not available.', cannot_wish: 'You can only wish connected friends who share their birthday.', not_birthday_today: 'It isn’t their birthday today.', not_eligible_for_checkin: 'Check-in isn’t available for this account.', invalid_post: 'Write something first.', invalid_comment: 'Comment can’t be empty.' };
async function run(fn) { try { await fn(); } catch (e) { toast(ERR[e.code] || 'Something went wrong. Please try again.'); } await render(); }
const ACT = {
  like: d => feed.toggleLike(me, d.id), save: async d => toast((await feed.toggleSave(me, d.id)) ? 'Saved' : 'Removed from saved'), open: d => { modal = d.id; },
  share: async d => { const link = location.href.split('#')[0] + '#/post/' + d.id; try { await navigator.clipboard.writeText(link); toast('Link copied'); } catch { toast(link); } },
  connect: async d => { await conn.send(me, d.id); toast('Request sent (demo)'); }, accept: async d => { await conn.respond(d.id, me, 'accept'); toast('Connected'); },
  reject: d => conn.respond(d.id, me, 'reject'), cancel: d => conn.respond(d.id, me, 'cancel'), readall: () => notes.markAllRead(me), read: d => notes.markRead(me, d.id),
  block: async d => { await conn.blockUser(me, d.id); location.hash = '#/home'; toast('User blocked'); },
  ff: async () => { clock.set(new Date(clock.now().getTime() + 15 * 864e5).toISOString()); const n = await ver.enforceDeadlines(); bday.run(); toast(`Clock +15 days · ${n} account(s) restricted (simulated)`); },
  reset: async () => { S.reset(); clock.set(SEED_NOW); bday.run(); seen.clear(); toast('Demo data reset'); },
  appeal: () => { S.data.verification.find(v => v.userId === me).campusState = 'review_needed'; toast('Appeal submitted for manual review (simulated)'); },
  theme: () => { const r = document.documentElement, d = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = d ? 'light' : 'dark'; },
  create: () => { ov(`<div class="cm"><button class="x" style="color:var(--ink);background:var(--soft)" data-act="close" aria-label="Close">${I('x', false, 20)}</button><h2>Create new post</h2><form data-form="post" style="display:grid;gap:.6rem"><textarea class="field" name="t" rows="6" maxlength="1000" placeholder="Share something with your campus…" aria-label="Post text" required></textarea><select name="v" aria-label="Who can see this"><option value="connections">Connections</option><option value="private">Only me</option></select><button class="btn">Share</button></form></div>`); modal = null; },
  story: d => { const ids = S.data.users.filter(u => (u.id === me || S.connected(me, u.id)) && recent(u.id).length).map(u => u.id); story(ids, Math.max(0, ids.indexOf(d.id))); return 'noRender'; },
  close: () => closeOv()
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && ACT[t.dataset.act]) { if (t.tagName !== 'A' || t.getAttribute('href') === '#') e.preventDefault(); const k = t.dataset.act;
    if (k === 'story' || k === 'close' || k === 'create') { ACT[k](t.dataset); if (k === 'close') render(); return; } run(() => ACT[k](t.dataset)); return; }
  const sv = e.target.closest('[data-sv]');
  if (sv) { const o = $('#ov'), ids = o.dataset.ids.split(','), i = +o.dataset.i, r = sv.getBoundingClientRect(); story(ids, e.clientX - r.left < r.width / 3 ? i - 1 : i + 1); return; }
  if (e.target.id === 'ov') { closeOv(); render(); }
});
document.addEventListener('dblclick', e => { const t = e.target.closest('[data-dbl]'); if (!t) return; const h = t.querySelector('.heart'); h.classList.remove('go'); void h.offsetWidth; h.classList.add('go');
  if (!likesOf(t.dataset.dbl).some(l => l.userId === me)) run(() => feed.toggleLike(me, t.dataset.dbl)); });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const d = new FormData(f), k = f.dataset.form, id = f.dataset.id;

    if (k === 'wish') toast(bday.sendWish(me, id) ? 'Birthday wish sent (simulated)' : 'You already sent a wish today');
    if (k === 'checkin') { await ver.redeemCheckin(me, d.get('c')); toast('Verified (simulated)'); }
  });
});
document.addEventListener('input', e => { if (e.target.matches('[data-search]')) { q = e.target.value; $('#results').innerHTML = results(); } });
document.addEventListener('change', e => { if (e.target.matches('.who')) { me = e.target.value; closeOv(); location.hash = '#/home'; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#ov').classList.contains('on')) { closeOv(); render(); } });
window.addEventListener('hashchange', () => { q = location.hash.startsWith('#/explore') ? q : ''; render(); }); render();
